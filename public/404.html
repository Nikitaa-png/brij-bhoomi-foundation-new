<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Brij Bhoomi Foundation</title>
  <style>
    body { margin: 0; background: #0a0a0a; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 2rem; }
    h1 { font-size: 5rem; margin: 0; color: #8B6F47; }
    h2 { font-size: 1.5rem; margin: 0.5rem 0 1rem; }
    p  { color: rgba(255,255,255,0.6); margin-bottom: 2rem; }
    a  { display: inline-block; padding: 0.75rem 2rem; background: #8B6F47; color: #fff; text-decoration: none; border-radius: 3px; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; }
    a:hover { background: #fff; color: #000; }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you are looking for doesn't exist or has been moved.</p>
    <a href="/">Return to Home</a>
  </div>
</body>
</html>
